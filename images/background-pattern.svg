<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="grid-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <pattern id="circuit-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Circuit nodes -->
      <circle cx="50" cy="50" r="2" fill="currentColor" opacity="0.15"/>
      <circle cx="150" cy="50" r="2" fill="currentColor" opacity="0.15"/>
      <circle cx="50" cy="150" r="2" fill="currentColor" opacity="0.15"/>
      <circle cx="150" cy="150" r="2" fill="currentColor" opacity="0.15"/>
      <!-- Circuit connections -->
      <path d="M 50 50 L 150 50" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
      <path d="M 50 50 L 50 150" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
      <path d="M 150 50 L 150 150" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
      <path d="M 50 150 L 150 150" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
      <!-- Diagonal connections -->
      <path d="M 50 50 L 150 150" stroke="currentColor" stroke-width="0.3" opacity="0.08" stroke-dasharray="2,2"/>
    </pattern>
    <pattern id="tech-pattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <!-- Code brackets -->
      <path d="M 30 80 L 20 100 L 30 120" fill="none" stroke="currentColor" stroke-width="1" opacity="0.08"/>
      <path d="M 270 80 L 280 100 L 270 120" fill="none" stroke="currentColor" stroke-width="1" opacity="0.08"/>
      <!-- Database icon -->
      <ellipse cx="150" cy="60" rx="40" ry="8" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <ellipse cx="150" cy="60" rx="35" ry="6" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.06"/>
      <line x1="110" y1="60" x2="110" y2="140" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <line x1="190" y1="60" x2="190" y2="140" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <ellipse cx="150" cy="140" rx="40" ry="8" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <!-- Cloud icon -->
      <path d="M 80 200 Q 60 200 50 220 Q 40 200 60 200 Q 50 180 70 180 Q 80 160 100 170 Q 110 150 130 160 Q 140 150 160 150 Q 180 150 190 170 Q 210 170 220 190 Q 230 170 250 180" fill="none" stroke="currentColor" stroke-width="1" opacity="0.06"/>
      <!-- Gear icon -->
      <circle cx="250" cy="250" r="25" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <circle cx="250" cy="250" r="15" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.06"/>
      <line x1="250" y1="225" x2="250" y2="240" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
      <line x1="250" y1="260" x2="250" y2="275" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
      <line x1="225" y1="250" x2="240" y2="250" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
      <line x1="260" y1="250" x2="275" y2="250" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
  <rect width="100%" height="100%" fill="url(#circuit-pattern)"/>
  <rect width="100%" height="100%" fill="url(#tech-pattern)"/>
</svg>

